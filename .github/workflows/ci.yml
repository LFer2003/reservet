name: Verificaciones
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reservet_candidate
          POSTGRES_PASSWORD: ci_local_password
          POSTGRES_DB: reservet_candidate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://reservet_candidate:ci_local_password@localhost:5432/reservet_candidate
          TEST_DATABASE_URL: postgresql://reservet_candidate:ci_local_password@localhost:5432/reservet_candidate_test
      - name: Test deployment scripts without Docker or secrets
        shell: pwsh
        run: ./tests/deploy.test.ps1
